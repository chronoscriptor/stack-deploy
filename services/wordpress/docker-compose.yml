name: agent-wordpress

services:
  wordpress:
    image: wordpress:6.7-php8.3-apache
    container_name: agent-wordpress
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    environment:
      WORDPRESS_DB_HOST: agent-wordpress-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISALLOW_FILE_MODS', false);
    volumes:
      - agent-wordpress:/var/www/html
    networks:
      - agent-shared-net
    depends_on:
      - db

  db:
    image: mariadb:11.4
    container_name: agent-wordpress-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?}
    volumes:
      - agent-wordpress-db:/var/lib/mysql
    networks:
      - agent-shared-net

volumes:
  agent-wordpress:
  agent-wordpress-db:

networks:
  agent-shared-net:
    external: true
